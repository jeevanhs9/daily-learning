name: Daily Learning Update

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update learning log
        run: |
          echo "Daily learning update - $(date -u '+%Y-%m-%d')" >> progress.txt

      - name: Commit and push
        run: |
          git config user.name "jeevanhs9"
          git config user.email "211521351+jeevanhs9@users.noreply.github.com"
          git add progress.txt
          git commit -m "Daily learning update $(date -u '+%Y-%m-%d')" || exit 0
          git push
