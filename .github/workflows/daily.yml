name: Daily Learning Update

on:
  schedule:
    - cron: "5 15 * * *"   # 8:35 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily learning file
        run: |
          mkdir -p daily

          DATE=$(date -u '+%Y-%m-%d')

          cat > "daily/$DATE.md" << EOF
          # Daily Learning - $DATE

          Daily learning activity completed.

          ## Topics

          - Java
          - DSA
          - GitHub
          EOF

      - name: Commit and push
        run: |
          git config user.name "jeevanhs9"
          git config user.email "211521351+jeevanhs9@users.noreply.github.com"

          git add daily/

          git commit \
            --author="jeevanhs9 <211521351+jeevanhs9@users.noreply.github.com>" \
            -m "Daily learning - $(date -u '+%Y-%m-%d')" \
            || echo "Nothing to commit"

          git push
